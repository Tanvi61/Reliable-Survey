<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <defs>
    <linearGradient id="hypackWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003865"/>
      <stop offset="50%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#00D2C4"/>
    </linearGradient>
  </defs>

  <!-- Bathymetric Sonar Wave Swell / Transducer Pulse -->
  <g transform="translate(18, 30)">
    <!-- Sonar / Depth Sounder arcs -->
    <path d="M4,44 C12,18 28,6 52,6 C76,6 92,18 100,44" fill="none" stroke="url(#hypackWave)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M14,44 C20,24 32,15 52,15 C72,15 84,24 90,44" fill="none" stroke="#00A3E0" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M25,44 C30,30 38,24 52,24 C66,24 74,30 79,44" fill="none" stroke="#003865" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <circle cx="52" cy="44" r="5" fill="#00D2C4"/>
  </g>

  <!-- HYPACK Wordmark -->
  <g transform="translate(126, 62)">
    <text font-family="'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#003865" letter-spacing="1.5px">HYPACK</text>
    
    <!-- Tagline: a xylem brand -->
    <text x="2" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5" fill="#5A6B82" letter-spacing="0.8px">a <tspan font-weight="800" fill="#007799">xylem</tspan> brand</text>
  </g>
</svg>
